<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A little birthday surprise filled with love, laughter, and warm wishes." />
  <title>Happy Birthday! 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero">
    <div class="confetti" aria-hidden="true"></div>
    <section class="card" aria-labelledby="birthday-title">
      <span class="eyebrow">A little surprise for you</span>
      <div class="cake" aria-hidden="true">🎂</div>
      <h1 id="birthday-title">Happy Birthday! <span>🎉</span></h1>
      <p class="intro">May your special day be filled with sunshine, laughter, wonderful memories, and everything that makes you smile.</p>
      <button class="wish-button" id="wishButton" type="button">Make a wish ✨</button>
      <p class="wish" id="wishMessage" aria-live="polite">Click the button for a birthday surprise!</p>
      <div class="signature">With lots of love 💖</div>
    </section>
  </main>
  <footer>Made especially for a very special person</footer>
  <script src="script.js"></script>
</body>
</html>
